<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>3D Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <video id="camera" autoplay playsinline></video>

  <!-- overlay -->
  <div class="overlay">
    <div class="scan-frame"></div>
    <p class="hint">Обойди объект на 360°</p>
  </div>

  <!-- top bar -->
  <div class="top-bar">
    <span id="count">0</span>
    <button id="switch">🔄</button>
  </div>

  <!-- bottom controls -->
  <div class="controls">
    <button id="auto">AUTO</button>
    <button id="capture" class="capture"></button>
    <button id="finish">OK</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
