<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<video id="camera" autoplay playsinline></video>

<!-- overlay -->
<div class="overlay">
  <div class="frame"></div>
  <p class="hint">Обойди объект медленно</p>
</div>

<!-- TOP -->
<div class="top">
  <div id="count">0</div>
  <button id="switch">🔄</button>
</div>

<!-- START BUTTON -->
<button id="start" class="start-btn">▶ Включить камеру</button>

<!-- BOTTOM -->
<div class="bottom">
  <button id="auto">AUTO</button>
  <button id="capture" class="capture"></button>
  <button id="finish">OK</button>
</div>

<script src="app.js"></script>
</body>
</html>
